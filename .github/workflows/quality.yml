name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.4,<2"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check commit messages and pull request title
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/check_commit_message.py --message "$PR_TITLE"
            python scripts/check_commit_message.py --range "$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_commit_message.py --range "$BEFORE_SHA..HEAD"
          else
            python scripts/check_commit_message.py --rev HEAD
          fi
